name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: perf-simulator-python
  AZURE_RESOURCE_GROUP: perf-simulator-rg
  PYTHON_VERSION: '3.14'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: app-package
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r src deploy/
          cp -r docs deploy/
          cp requirements.txt deploy/
          cp startup.txt deploy/ 2>/dev/null || echo "uvicorn src.main:app --host 0.0.0.0 --port 8000" > deploy/startup.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-package
          path: deploy/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: app-package
          path: deploy/
      
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy/
      
      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || echo "Health check pending..."
