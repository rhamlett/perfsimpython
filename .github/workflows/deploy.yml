name: Deploy to Azure

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: perfsimpython
  AZURE_RESOURCE_GROUP: rhamlettRG

jobs:
  deploy:
    name: Deploy Code
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Git Push to Kudu
        run: |
          # Get deployment credentials
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "{user:publishingUserName,pass:publishingPassword}" -o tsv)
          USER=$(echo "$CREDS" | cut -f1)
          PASS=$(echo "$CREDS" | cut -f2)
          
          # Configure git for deployment
          git config user.email "deploy@github.com"
          git config user.name "GitHub Actions"
          
          # Push to Kudu Git endpoint
          git remote add azure "https://${USER}:${PASS}@${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/${{ env.AZURE_WEBAPP_NAME }}.git" 2>/dev/null || \
            git remote set-url azure "https://${USER}:${PASS}@${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/${{ env.AZURE_WEBAPP_NAME }}.git"
          git push azure HEAD:master --force

      - name: Verify deployment
        run: |
          echo "Waiting for Oryx build and app startup..."
          sleep 120
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || echo "Health check pending..."
