name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: perfsimpython
  AZURE_RESOURCE_GROUP: rhamlettRG

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run Black (format check)
        run: black --check --diff src/ tests/
      
      - name: Run Ruff (lint)
        run: ruff check src/ tests/
      
      - name: Run mypy (type check)
        run: mypy src/

  quick-test:
    name: Quick Tests (Skip Slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run tests (skip slow)
        run: pytest tests/ -n auto --dist loadfile -m "not slow" -q --tb=short

  full-test:
    name: Full Tests with Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Run all tests with coverage
        run: pytest tests/ -n auto --dist loadfile --cov=src --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, quick-test]
    steps:
      - uses: actions/checkout@v5
      
      - name: Build Docker image
        run: docker build -t perf-simulator-python:${{ github.sha }} .
      
      - name: Verify Docker image
        run: |
          docker run --rm -d --name test-container -p 8000:8000 perf-simulator-python:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/api/health || exit 1
          docker stop test-container

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via Git Push to Kudu
        run: |
          # Get deployment credentials
          DEPLOY_USER=$(az webapp deployment list-publishing-credentials \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query publishingUserName -o tsv)
          DEPLOY_PASS=$(az webapp deployment list-publishing-credentials \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query publishingPassword -o tsv)
          
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASS" ]; then
            echo "ERROR: Failed to fetch deployment credentials"
            exit 1
          fi
          
          # Configure git
          git config user.email "deploy@github.com"
          git config user.name "GitHub Actions"
          
          # URL-encode the password using Python (handles all special characters)
          ENCODED_PASS=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$DEPLOY_PASS")
          
          # Push to Kudu Git endpoint
          git push "https://${DEPLOY_USER}:${ENCODED_PASS}@${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/${{ env.AZURE_WEBAPP_NAME }}.git" HEAD:master --force

      - name: Verify deployment
        run: |
          echo "Waiting for Oryx build and app startup..."
          sleep 120
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || echo "Health check pending..."
